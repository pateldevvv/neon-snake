<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Neon Snake</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; touch-action: none; user-select: none; }
  body { margin: 0; min-height: 100vh; background: #05060f; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: 4px; color: #0ff; text-shadow: 0 0 12px #0ff, 0 0 30px #0ff; }
  .hud { display: flex; gap: 28px; color: #f0f; text-shadow: 0 0 8px #f0f; font-weight: 700; }
  canvas { width: min(92vw, 420px); height: min(92vw, 420px); background: #0a0c1f; border: 2px solid #0ff; border-radius: 12px; box-shadow: 0 0 25px rgba(0,255,255,.4), inset 0 0 25px rgba(0,255,255,.15); }
  p { opacity: .6; font-size: 13px; margin: 0; }
</style>
</head>
<body>
<h1>NEON SNAKE</h1>
<div class="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
<canvas id="c" width="400" height="400"></canvas>
<p>Swipe to steer. Tap to start. Arrow keys work too.</p>
<script>
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const N = 20, S = 20;
  let snake, dir, next, food, score = 0, state = "start", last = 0, delay = 140, parts = [];
  let best = Number(localStorage.getItem("neonBest")) || 0;
  document.getElementById("best").textContent = best;

  function reset() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = next = {x:1,y:0};
    score = 0; delay = 140; parts = [];
    placeFood(); showScore(); state = "play";
  }
  function showScore() { document.getElementById("score").textContent = score; }
  function placeFood() {
    do { food = {x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N)}; }
    while (snake.some(s => s.x === food.x && s.y === food.y));
  }
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) parts.push({x: x*S+S/2, y: y*S+S/2, vx: (Math.random()-.5)*7, vy: (Math.random()-.5)*7, life: 1, color});
  }
  function turn(x, y) { if (x === -dir.x && y === -dir.y) return; next = {x, y}; }

  function step() {
    dir = next;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    const hit = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(s => s.x === head.x && s.y === head.y);
    if (hit) {
      burst(snake[0].x, snake[0].y, "#ff3b6b", 40);
      state = "over";
      if (score > best) { best = score; localStorage.setItem("neonBest", best); document.getElementById("best").textContent = best; }
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10; showScore();
      burst(food.x, food.y, "#ff0", 20);
      delay = Math.max(60, delay - 3);
      placeFood();
    } else snake.pop();
  }

  function draw(t) {
    ctx.fillStyle = "#0a0c1f"; ctx.fillRect(0, 0, 400, 400);
    ctx.strokeStyle = "rgba(0,255,255,.06)"; ctx.lineWidth = 1;
    for (let i = 0; i <= N; i++) {
      ctx.beginPath(); ctx.moveTo(i*S, 0); ctx.lineTo(i*S, 400); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*S); ctx.lineTo(400, i*S); ctx.stroke();
    }
    if (snake) {
      const pulse = 8 + Math.sin(t / 150) * 5;
      ctx.shadowColor = "#ff0"; ctx.shadowBlur = 15 + pulse;
      ctx.fillStyle = "#ff0";
      ctx.beginPath(); ctx.arc(food.x*S + S/2, food.y*S + S/2, 6 + pulse/6, 0, 7); ctx.fill();
      snake.forEach((s, i) => {
        const c = "hsl(" + (180 + i*6) + ",100%,60%)";
        ctx.shadowColor = c; ctx.shadowBlur = 15; ctx.fillStyle = c;
        ctx.fillRect(s.x*S + 1, s.y*S + 1, S - 2, S - 2);
      });
    }
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.life -= 0.03;
      ctx.globalAlpha = Math.max(p.life, 0); ctx.shadowColor = p.color; ctx.shadowBlur = 10; ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
    });
    parts = parts.filter(p => p.life > 0);
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    if (state !== "play") {
      ctx.fillStyle = "rgba(5,6,15,.7)"; ctx.fillRect(0, 0, 400, 400);
      ctx.textAlign = "center"; ctx.shadowColor = "#0ff"; ctx.shadowBlur = 20; ctx.fillStyle = "#0ff";
      ctx.font = "bold 34px system-ui";
      ctx.fillText(state === "start" ? "NEON SNAKE" : "GAME OVER", 200, 180);
      ctx.font = "18px system-ui"; ctx.fillStyle = "#f0f"; ctx.shadowColor = "#f0f";
      ctx.fillText(state === "over" ? "Score " + score : "Eat the glowing dots", 200, 215);
      ctx.fillStyle = "#fff"; ctx.shadowBlur = 0;
      ctx.fillText("Tap to " + (state === "start" ? "start" : "play again"), 200, 255);
    }
  }

  function loop(t) {
    if (state === "play" && t - last > delay) { last = t; step(); }
    draw(t);
    requestAnimationFrame(loop);
  }

  let sx = 0, sy = 0;
  document.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; });
  document.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) { if (state !== "play") reset(); return; }
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  });
  document.addEventListener("click", () => { if (state !== "play") reset(); });
  document.addEventListener("keydown", e => {
    const k = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]}[e.key];
    if (k) { if (state !== "play") reset(); else turn(k[0], k[1]); }
  });
  requestAnimationFrame(loop);
</script>
</body>
</html>
